services:
  app:
    environment:
      KBOT_AUTOSEED_ADMIN: "true"
      KBOT_AUTOSEED_ADMIN_EMAIL: admin@ecommerce-ops.local
      KBOT_AUTOSEED_ADMIN_PASSWORD: admin12345
      KBOT_KB_MARKDOWN_ALLOWED_ROOTS: /scenarios
    volumes:
      - ${PWD}/evals/corpus/rag-benchmark:/scenarios/rag-benchmark:ro
      - ${PWD}/evals/corpus/rag-long-benchmark:/scenarios/rag-long-benchmark:ro

  worker:
    environment:
      KBOT_KB_MARKDOWN_ALLOWED_ROOTS: /scenarios
    volumes:
      - ${PWD}/evals/corpus/rag-benchmark:/scenarios/rag-benchmark:ro
      - ${PWD}/evals/corpus/rag-long-benchmark:/scenarios/rag-long-benchmark:ro
